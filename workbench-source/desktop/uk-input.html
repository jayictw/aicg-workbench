<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>离线测试 · 专用假值输入</title><link rel="stylesheet" href="acs-key://input/input.css"></head><body><main><h1>离线测试，请勿输入真 Key</h1><p>此独立窗口短暂接触明文。只接受本窗口生成并登记的程序假值；不会发送网络请求。</p><dl id="binding" aria-label="已冻结的输入目标"><dt>服务／账户／允许主机</dt><dd>正在核对本地输入目标…</dd></dl><label>假值长度 <select id="length"><option>32</option><option>1</option><option>4</option><option>8</option><option>9</option><option>12</option><option>13</option><option>16</option><option>16384</option></select></label><button id="issue" disabled>生成并填入程序假值</button><label for="secret">程序假值（允许粘贴已登记值）</label><input id="secret" type="password" autocomplete="off" maxlength="16384" spellcheck="false" data-secret="true"><p id="message" role="status">生成假值后提交。不提供显示或复制功能。</p><div><button id="cancel">取消</button><button id="submit" disabled>提交假值并关闭</button></div><p>提交或取消后清空并销毁窗口；不清除系统剪贴板。</p></main><script src="acs-key://input/input.js"></script></body></html>
