<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>确认图片生成</title><link rel="stylesheet" href="acs-confirm://one/fee.css"></head><body class="gc-native"><main class="gc-shell"><header><h1>确认图片生成</h1></header><div class="gc-scroll">
<section class="gc-section"><h2>生成摘要</h2><p id="summary-output"></p><p id="mode" class="notice"></p></section>
<section class="gc-section" aria-label="实际送出图片"><h2>实际参考图 <span id="image-count" class="gc-count"></span></h2><p class="gc-muted">仅发送以下图片，按图序送出；用途为本地使用指引，不保证模型完全遵循。</p><div id="actual-images" class="gc-reference-grid"></div></section>
<section class="gc-section"><h2>完整实际提示词</h2><pre id="prompt" class="gc-prompt"></pre><p id="purpose" class="gc-muted"></p></section>
<details class="gc-section" id="retained-section"><summary>任务保留，本次不发送</summary><div id="retained-references"></div><figure id="reference-box" hidden><img id="reference" width="200" alt="保留的摄影棚快照，是否发送以下方实际参考图为准"><figcaption id="reference-hash"></figcaption></figure><p id="reference-state"></p></details>
<details class="gc-section" id="edit-section"><summary>修改输入与摄影棚方式</summary><p>修改后旧确认立即失效，请更新输入预览再确认。</p><label for="original">主提示词</label><textarea id="original" rows="3"></textarea><label for="adopted">摄影棚补充文字 · 本次采用稿</label><textarea id="adopted" rows="3"></textarea><p id="adopted-state"></p><p>修改补充文字不会改变参考图。切换方式保留修改稿。</p><details><summary>查看自动原文</summary><pre id="automatic"></pre></details><button id="restore" type="button">恢复自动内容</button><div id="restore-choice" hidden><p>恢复将覆盖当前修改稿。</p><button id="restore-yes">确认覆盖采用稿</button><button id="restore-no">保留修改稿</button></div><label for="studio-mode">摄影棚本次方式 · 主提示词始终保留</label><select id="studio-mode"><option value="BASE">不使用摄影棚</option><option value="B">只使用摄影棚图片</option><option value="A">只使用已确认的补充文字</option><option value="C">使用摄影棚图片及补充文字</option></select><button id="refresh">更新输入预览</button></details>
<details class="gc-section gc-technical"><summary>技术详情</summary><dl id="facts"></dl><div id="image-technical"></div><p id="snapshot"></p><p id="source"></p><p id="expiry"></p></details></div>
<footer class="gc-footer"><div class="gc-fee"><p id="price-note"></p><p id="risk"></p><p id="status" role="status" aria-live="polite"></p></div><div class="gc-actions"><button id="cancel">返回修改</button><button id="approve" disabled>确认生成</button></div></footer></main>
<dialog id="image-viewer" aria-labelledby="viewer-title"><h2 id="viewer-title"></h2><img id="viewer-image" alt="放大参考图"><button id="viewer-close">关闭大图</button></dialog><script src="acs-confirm://one/fee.js"></script></body></html>
