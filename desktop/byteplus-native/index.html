<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-ui="BytePlus 連接與生成">BytePlus 連接與生成</title><link rel="stylesheet" href="style.css"></head><body><main><label class="native-ui-language"><span data-ui="Language">语言</span><select id="ui-language" aria-label="Interface language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><h1 id="title">BytePlus</h1><p id="description"></p><form><label id="key-label" hidden>BytePlus API Key<input id="secret" type="password" autocomplete="off" spellcheck="false" minlength="16" maxlength="4096"></label><fieldset id="source-fields" hidden><legend data-ui="Private TOS source">私有 TOS 来源</legend><label><span data-ui="Presigned upload URL">上传预签名 URL</span><input id="source-put" type="password" autocomplete="off" spellcheck="false" maxlength="16384"></label><label><span data-ui="Presigned download URL for the same object">同一对象的下载预签名 URL</span><input id="source-get" type="password" autocomplete="off" spellcheck="false" maxlength="16384"></label><button id="source-reveal" type="button" aria-pressed="false" data-ui="Show private URLs">显示私密 URL</button><p data-ui="Use your own private ap-southeast-1 bucket. Sign PUT with x-tos-forbid-overwrite=true. Storage and transfer charges may apply. No bucket or public permission is created. The GET URL must cover the task execution lifetime and safety margin."></p></fieldset><fieldset id="asset-fields" hidden><legend data-ui="Private asset download link">私有素材下载链接</legend><label><span data-ui="Asset ID">素材 ID</span><input id="asset-id" autocomplete="off" spellcheck="false" maxlength="128"></label><label><span data-ui="BytePlus project name">BytePlus 云项目名称</span><input id="asset-project" autocomplete="off" value="default" maxlength="256"></label><label><span data-ui="Asset group ID">素材组 ID</span><input id="asset-group" autocomplete="off" spellcheck="false" maxlength="128"></label><label>Access Key ID<input id="asset-ak" type="password" autocomplete="off" spellcheck="false" maxlength="256"></label><label>Secret Access Key<input id="asset-sk" type="password" autocomplete="off" spellcheck="false" maxlength="256"></label><label><span data-ui="Task execution limit (seconds)">任务执行期限（秒）</span><input id="asset-ttl" type="number" min="3600" max="259200" step="1" value="3600"></label><p data-ui="GetAsset is a read action using separate AK/SK permission. Keys stay in this native request and are not saved. The resulting HTTPS link lasts at most 12 hours. Choose a shorter task limit; this does not grant asset URI authority."></p></fieldset><p id="source-cancel-warning" hidden data-ui="Cancelling only stops local work. A sent upload may already exist remotely and incur storage or transfer charges. No remote object is deleted automatically."></p><p id="asset-cost-warning" hidden data-ui="Asset reads and downloads may incur supplier network charges. This step never submits paid generation."></p><section id="details"></section><p id="error" role="alert"></p><details id="error-details" hidden><summary data-ui="錯誤詳情">错误详情</summary><pre id="error-original"></pre></details><div><button type="button" id="cancel"><span data-ui="取消">取消</span></button><button type="submit" data-native-submit id="submit"><span data-ui="確認">確認</span></button></div></form></main><script src="app.js"></script></body></html>
