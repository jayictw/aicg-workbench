<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-ui="本机凭据 · BYOK">本机凭据 · BYOK</title><link rel="stylesheet" href="style.css"></head><body><main><label class="native-ui-language"><span data-ui="Language">语言</span><select id="ui-language" aria-label="Interface language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><small><span data-ui="本机安全存储">本机安全存储</span></small><h1><span data-ui="连接凭据">连接凭据</span></h1><p id="connection"></p><p id="identity"></p><p id="status" role="status" aria-live="polite"><span data-ui="正在读取状态…">正在读取状态…</span></p><details id="error-details" hidden><summary data-ui="Diagnostics">诊断</summary><pre id="error-original"></pre></details><form id="form" autocomplete="off"><label for="secret"><span data-ui="API Key（不回显已保存的值）">API Key（不回显已保存的值）</span></label><input id="secret" type="password" autocomplete="new-password" spellcheck="false" maxlength="4096" aria-describedby="hint"><p id="hint"><span data-ui="仅在此窗口输入。保存后立即清空，不进入画布、工程或 MCP。">仅在此窗口输入。保存后立即清空，不进入画布、工程或 MCP。</span></p><label class="remember"><input id="remember" type="checkbox"><span data-ui="记住 Key · 使用 Windows 加密，重启后恢复">记住 Key · 使用 Windows 加密，重启后恢复</span></label><p><span data-ui="不勾选则仅本次运行有效；原先记住的副本会被删除。保存不验证账户，也不调用 API。">不勾选则仅本次运行有效；原先记住的副本会被删除。保存不验证账户，也不调用 API。</span></p><div class="actions"><button data-credential-action="save" type="submit"><span data-ui="保存或更换 Key">保存或更换 Key</span></button><button data-credential-action="delete" id="delete" type="button"><span data-ui="彻底删除 Key">彻底删除 Key</span></button><button id="close" type="button"><span data-ui="完成">完成</span></button></div></form></main><script src="main.js"></script></body></html>
