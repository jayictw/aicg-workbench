<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>C4 原批剩餘三圖</title><link rel="stylesheet" href="account.css"></head><body><main><h1>原批剩餘三張繼續生成</h1><p>只生成原批的產品、場景、風格各1張，1024×1024 PNG，不上傳參考圖。原人物請求T01仍未知，不重送。</p><p>最多新增3次；加上原1次，總共最多4次。沿用單次¥0.12、本批¥0.60上限，沒有追加額度。遇失敗或未知立即停，不自動重送。</p><p class="muted">請重新輸入同一方舟帳戶的既有Key，只在這次程序記憶體使用。程式不讀舊窗Key，不寫入硬碟。結束或關窗解除引用，不保證記憶體立即物理抹除。不要貼到聊天。</p><form id="account-form" autocomplete="off"><label class="check"><input id="same-account" type="checkbox" required>我確認使用原批同一帳戶的既有Key（程式不認證帳戶身份）</label><label>既有方舟Key（僅在本機填寫）<input id="key" type="password" required minlength="16" maxlength="4096" autocomplete="off" spellcheck="false" autocapitalize="off"></label><p id="error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消並清除</button><button id="submit" type="submit">確認並執行剩餘3張</button></div></form><section id="progress" hidden><p id="status" role="status"></p><p class="muted">關閉此窗會停止後續提交並清除憑據引用；已送出的請求不保證取消或退款。未知時不會重新POST。</p><button id="close" type="button">關閉並清除</button></section></main><script src="account.js"></script></body></html>
